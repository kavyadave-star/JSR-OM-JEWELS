<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - JSR OM JEWELS</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #333; }
    .checkout-card { max-width: 480px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #1a1a1a; text-align: center; }
    .order-summary { background: #fdf6ec; border: 1px solid #faecd8; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
    .order-summary p { margin: 6px 0; font-size: 15px; }
    .qr-container { text-align: center; margin: 20px 0; padding: 15px; border: 1px dashed #ccc; border-radius: 8px; background: #fafafa; }
    .qr-container img { max-width: 210px; height: auto; border-radius: 8px; }
    .pay-btn { display: block; width: 100%; text-align: center; background: #28a745; color: white; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 20px; box-sizing: border-box; }
    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #555; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .submit-btn { width: 100%; background: #007bff; color: white; border: none; padding: 13px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .submit-btn:disabled { background: #94c3f5; cursor: not-allowed; }
    #status-msg { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="checkout-card">
  <h2>JSR OM JEWELS</h2>
  <div class="order-summary">
    <p><strong>Item:</strong> Silver Gemstone Signet Ring</p>
    <p><strong>Total Payable:</strong> ₹<span id="order-amount">1</span></p>
  </div>

  <div class="qr-container">
    <p style="margin-top:0; font-size: 13px; color: #666;">Scan with PhonePe / GPay / Paytm</p>
    <img id="upi-qr" src="" alt="Scan to Pay">
    <p style="font-size: 12px; color: #888; margin-bottom: 0;">Merchant: JSR OM JEWELS</p>
  </div>

  <a id="upi-intent-link" href="#" class="pay-btn">📲 Tap to Pay via Any UPI App</a>

  <form id="order-form">
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" id="cust-name" placeholder="Enter your name" required>
    </div>
    <div class="form-group">
      <label>Mobile Number *</label>
      <input type="tel" id="cust-phone" placeholder="10-digit mobile number" required>
    </div>
    <div class="form-group">
      <label>Delivery Address & Pincode *</label>
      <input type="text" id="cust-address" placeholder="Flat, Street, City, Pincode" required>
    </div>
    <div class="form-group">
      <label>12-Digit UTR / Transaction ID (from payment app) *</label>
      <input type="text" id="utr-number" maxlength="12" pattern="\d{12}" placeholder="e.g. 431289561234" required>
    </div>

    <button type="submit" id="submit-button" class="submit-btn">Confirm Order</button>
  </form>

  <div id="status-msg"></div>
</div>

<script>
  const merchantVpa = "BHARATPE2V0R0Y8D9L54487@unitype";
  const merchantName = "JSR OM JEWELS";
  const amount = document.getElementById("order-amount").innerText;

  const upiUrl = `upi://pay?pa=${encodeURIComponent(merchantVpa)}&pn=${encodeURIComponent(merchantName)}&am=${amount}&cu=INR&tn=${encodeURIComponent("Order Payment JSR OM JEWELS")}`;
  document.getElementById("upi-intent-link").href = upiUrl;

  const qrApi = `https://chart.googleapis.com/chart?chs=250x250&cht=qr&chl=${encodeURIComponent(upiUrl)}&choe=UTF-8`;
  document.getElementById("upi-qr").src = qrApi;

  const TELEGRAM_BOT_TOKEN = "9238756691:AAG48aoO1mrye59cwn55loRl-QLzBRu9Stk";
  const TELEGRAM_CHAT_ID = "8460520175";

  document.getElementById("order-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("submit-button");
    const statusMsg = document.getElementById("status-msg");

    const name = document.getElementById("cust-name").value;
    const phone = document.getElementById("cust-phone").value;
    const address = document.getElementById("cust-address").value;
    const utr = document.getElementById("utr-number").value;

    btn.disabled = true;
    btn.innerText = "Placing Order...";

    const messageText = `🛍️ *NEW ORDER - JSR OM JEWELS* 🛍️\n\n` +
      `👤 *Customer:* ${name}\n` +
      `📞 *Phone:* ${phone}\n` +
      `🏠 *Address:* ${address}\n` +
      `💰 *Amount:* ₹${amount}\n` +
      `🔢 *UTR Number:* \`${utr}\`\n\n` +
      `⚠️ *Action:* Check BharatPe / Bank statement for UTR ${utr}.`;

    try {
      const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: messageText,
          parse_mode: "Markdown"
        })
      });

      if (response.ok) {
        statusMsg.style.color = "green";
        statusMsg.innerHTML = "✅ Order Placed Successfully!";
        document.getElementById("order-form").reset();
      } else {
        throw new Error("Telegram error");
      }
    } catch (err) {
      statusMsg.style.color = "orange";
      statusMsg.innerHTML = "Order details saved! We will contact you shortly.";
    } finally {
      btn.disabled = false;
      btn.innerText = "Confirm Order";
    }
  });
</script>

</body>
</html>
